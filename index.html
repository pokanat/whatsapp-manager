<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Message Manager</title><style>
:root{font-family:Inter,system-ui,Arial;color:#eaf2f0;background:#0b1117}*{box-sizing:border-box}body{margin:0}header{padding:19px 24px;border-bottom:1px solid #26343d;display:flex;justify-content:space-between;align-items:center;background:#111b23}h1{font-size:20px;margin:0}small,.muted{color:#92a7af}.badge{background:#123c35;color:#72e5bd;padding:6px 10px;border-radius:16px;font-size:12px}main{display:grid;grid-template-columns:330px 1fr;min-height:calc(100vh - 70px)}aside{background:#111b23;border-right:1px solid #26343d;padding:20px}section{padding:25px;min-width:0}button,input,textarea,select{font:inherit}button{border:0;background:#19b68a;color:#052219;border-radius:9px;padding:11px 14px;font-weight:700;cursor:pointer}button.secondary{background:#263640;color:#eaf2f0}input,textarea,select{background:#0c151c;color:#eaf2f0;border:1px solid #31434c;padding:12px;border-radius:9px;width:100%;margin:7px 0}label{display:block;font-size:13px;color:#b4c6cc;margin-top:12px}.row{display:flex;gap:8px;align-items:center}.row>*{min-width:0}.row input{flex:1}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.stat,.card,.message{background:#182630;border:1px solid #2b3d46;border-radius:12px;padding:15px}.stat strong{display:block;font-size:23px}.account{width:100%;text-align:left;background:#182630;color:#eaf2f0;margin:5px 0;border:1px solid #2b3d46;display:flex;justify-content:space-between;align-items:center}.account.active{border-color:#19b68a;background:#15372f}.pill{font-size:11px;color:#f7c978}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.empty{padding:65px 15px;text-align:center;color:#92a7af}.message{margin:12px 0;overflow-wrap:anywhere}.message p{white-space:pre-wrap}.notice{border:1px solid #5d5033;background:#2b261b;color:#e8ce8a;padding:12px;border-radius:10px;font-size:13px;margin:18px 0}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}dialog{background:#15232c;color:#eaf2f0;border:1px solid #39505a;border-radius:14px;width:min(440px,94vw)}dialog::backdrop{background:#000a}dialog form{margin:0}.danger{color:#f29d9d}@media(max-width:680px){main{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid #26343d}section{padding:18px}header{padding:16px}h1{font-size:17px}}
</style></head><body><header><div><h1>◉ Multi-Account Message Manager</h1><small>Private browser dashboard · Demo / manual mode</small></div><span class="badge">Local only</span></header><main><aside><div class="top"><h3>Accounts</h3><button id="add">+ Add</button></div><div class="stats"><div class="stat"><strong id="total">0</strong><small>Total accounts</small></div><div class="stat"><strong id="unread">0</strong><small>Unread messages</small></div></div><input id="search" placeholder="Search account or number…" aria-label="Search accounts"><div id="accounts"></div></aside><section><div id="content"></div></section></main>
<dialog id="accountDialog"><form id="accountForm"><h3>Add phone number</h3><label>Account label<input id="label" maxlength="60" required placeholder="SIM 01"></label><label>Phone number<input id="phone" type="tel" required placeholder="+639XXXXXXXXX"></label><p class="muted">Adding a number does not log in to WhatsApp or activate SMS reception.</p><div class="toolbar"><button type="submit">Save account</button><button type="button" class="secondary" id="cancelAccount">Cancel</button></div></form></dialog>
<dialog id="messageDialog"><form id="messageForm"><h3>Add manual message</h3><label>Sender<input id="sender" required maxlength="100" placeholder="Sender name or number"></label><label>Message<textarea id="body" required rows="5" maxlength="5000" placeholder="Do not enter passwords or verification codes"></textarea></label><div class="toolbar"><button type="submit">Save message</button><button type="button" class="secondary" id="cancelMessage">Cancel</button></div></form></dialog>
<script>
const KEY='message-manager-v1';let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch{}if(!data||!Array.isArray(data.accounts))data={accounts:[],messages:[]};let selected=data.accounts[0]?.id||null;const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem(KEY,JSON.stringify(data));const uid=()=>crypto.randomUUID?.()||String(Date.now()+Math.random());
function render(){const filter=$('search').value.toLowerCase();$('total').textContent=data.accounts.length;$('unread').textContent=data.messages.filter(m=>!m.read).length;$('accounts').innerHTML=data.accounts.filter(a=>(a.label+' '+a.phone).toLowerCase().includes(filter)).map(a=>{const n=data.messages.filter(m=>m.account===a.id&&!m.read).length;return '<button class="account '+(selected===a.id?'active':'')+'" data-id="'+esc(a.id)+'"><span><strong>'+esc(a.label)+'</strong><br><small>'+esc(a.phone)+'</small></span><span class="pill">'+(n?n+' unread':'Not connected')+'</span></button>'}).join('')||'<p class="muted">No accounts yet.</p>';const a=data.accounts.find(a=>a.id===selected);if(!a){$('content').innerHTML='<div class="empty"><h2>Select an account</h2><p>Add a phone number to start organizing messages.</p></div>';return}const messages=data.messages.filter(m=>m.account===selected).sort((a,b)=>b.time-a.time);$('content').innerHTML='<div class="top"><div><h2>'+esc(a.label)+'</h2><span class="muted">'+esc(a.phone)+' · Not connected</span></div><button class="secondary" id="remove">Remove</button></div><div class="notice">This is a local manual-message dashboard. It cannot log in to WhatsApp, receive live SMS, or synchronize messages. Do not store verification codes here.</div><div class="toolbar"><button id="newMessage">+ Manual message</button><button class="secondary" id="markRead">Mark all read</button><button class="secondary" id="export">Export data</button></div><h3>Incoming messages ('+messages.length+')</h3>'+ (messages.length?messages.map(m=>'<article class="message"><div class="top"><strong>'+esc(m.sender)+'</strong><small>'+new Date(m.time).toLocaleString()+'</small></div><p>'+esc(m.body)+'</p><small>'+(m.read?'Read':'Unread')+'</small></article>').join(''):'<div class="empty">No messages for this account.<br><small>Add a manual test message to try the inbox.</small></div>');$('remove').onclick=()=>{if(confirm('Remove this account and its messages?')){data.accounts=data.accounts.filter(x=>x.id!==selected);data.messages=data.messages.filter(m=>m.account!==selected);selected=data.accounts[0]?.id||null;save();render()}};$('newMessage').onclick=()=>$('messageDialog').showModal();$('markRead').onclick=()=>{data.messages.filter(m=>m.account===selected).forEach(m=>m.read=true);save();render()};$('export').onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='message-manager-backup.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}}
$('accounts').onclick=e=>{const b=e.target.closest('[data-id]');if(b){selected=b.dataset.id;render()}};$('search').oninput=render;$('add').onclick=()=>$('accountDialog').showModal();$('cancelAccount').onclick=()=>$('accountDialog').close();$('cancelMessage').onclick=()=>$('messageDialog').close();$('accountForm').onsubmit=e=>{e.preventDefault();if(data.accounts.length>=500)return alert('500 account limit reached');const phone=$('phone').value.trim();if(!/^\+?[0-9 ()-]{7,22}$/.test(phone))return alert('Enter a valid phone number');if(data.accounts.some(a=>a.phone===phone))return alert('Number already exists');const a={id:uid(),label:$('label').value.trim(),phone};data.accounts.push(a);selected=a.id;save();$('accountForm').reset();$('accountDialog').close();render()};$('messageForm').onsubmit=e=>{e.preventDefault();const body=$('body').value.trim();if(/\b(?:otp|verification code|one.time password|security code)\b/i.test(body)||/\b\d{4,8}\b/.test(body))return alert('For safety, do not store verification codes or OTPs in this dashboard.');data.messages.push({id:uid(),account:selected,sender:$('sender').value.trim(),body,time:Date.now(),read:false});save();$('messageForm').reset();$('messageDialog').close();render()};render();
</script></body></html>
